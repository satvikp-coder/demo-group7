name: heritage-tourism
services:
  postgres:
    image: postgres:17-alpine
    container_name: group07-heritage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: heritage_planner
      POSTGRES_USER: heritage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.postgres}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - heritage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heritage -d heritage_planner"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  heritage_pgdata:
