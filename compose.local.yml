# Automatic first boot for a private persistent local production-like stack.
services:
  bootstrap:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_ADMIN_URL:?Use npm run local:up}
      DATABASE_SSL: disable
      DB_APP_ROLE: heritage_app
    depends_on:
      postgres:
        condition: service_healthy
    command: [node, scripts/bootstrap-local.js]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: local
      options:
        max-size: '10m'
        max-file: '5'
  backend:
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      CHAT_FREE_PLAN_CONFIRMED: ${CHAT_FREE_PLAN_CONFIRMED:-false}
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-6}
      CHAT_MAX_HISTORY: ${CHAT_MAX_HISTORY:-8}
      CHAT_MAX_OUTPUT_TOKENS: ${CHAT_MAX_OUTPUT_TOKENS:-700}
      CHAT_DAILY_CALL_LIMIT: ${CHAT_DAILY_CALL_LIMIT:-60}
      CHAT_TIMEOUT_MS: ${CHAT_TIMEOUT_MS:-18000}
      CHAT_MOCK: 'false'
    depends_on:
      bootstrap:
        condition: service_completed_successfully
