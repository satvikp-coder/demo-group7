# Never log request URLs, query strings, headers or bodies at the static edge.
log_format production escape=json '{"event":"edge_request","method":"$request_method","status":$status,"durationSeconds":$request_time,"requestId":"$upstream_http_x_request_id"}';
access_log /dev/stdout production;
# Upstream failures are recorded by status above; detailed nginx errors can include URLs.
error_log /dev/stderr crit;
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  # Trust forwarding only from the private Compose network (e.g. supplied Caddy).
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  client_max_body_size 100k;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Motion and existing styles require inline style attributes. Scripts remain external.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location = /health-static { access_log off; return 200 'ok'; }
  location /api/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    # Replace untrusted client forwarding headers. Backend is private to Compose.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
  }
  location = /health { proxy_pass http://backend:5000; }
  location = /ready { proxy_pass http://backend:5000; }
  location /assets/ { try_files $uri =404; expires 1y; }
  location = /sw.js { expires -1; }
  location / { expires -1; try_files $uri $uri/ /index.html; }
}
