<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="somSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141D32" />
      <stop offset="60%" stop-color="#243354" />
      <stop offset="100%" stop-color="#C99A3B" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B283E" />
      <stop offset="100%" stop-color="#0E1724" />
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="800" height="500" fill="url(#somSky)" />
  
  <!-- Ocean Horizon -->
  <rect y="330" width="800" height="170" fill="url(#seaGrad)" />
  
  <!-- Coastal Waves Lines -->
  <path d="M0 345 Q 100 340 200 345 T 400 345 T 600 345 T 800 345" stroke="#C99A3B" stroke-width="1.5" fill="none" opacity="0.4" />
  <path d="M0 365 Q 120 360 240 365 T 480 365 T 720 365 T 800 365" stroke="#F6F4EF" stroke-width="1" fill="none" opacity="0.3" />
  <path d="M0 395 Q 140 388 280 395 T 560 395 T 800 395" stroke="#C99A3B" stroke-width="1" fill="none" opacity="0.25" />
  
  <!-- Temple Base / Plinth overlooking sea -->
  <path d="M 220 340 L 580 340 L 550 310 L 250 310 Z" fill="#2A3855" stroke="#C99A3B" stroke-width="2" />
  <rect x="250" y="290" width="300" height="20" fill="#1E2A46" stroke="#C99A3B" stroke-width="1.5" />
  
  <!-- Somnath Temple Main Mandapa & Shikhara (Solanki architecture) -->
  <!-- Outer Mandapa -->
  <polygon points="270,290 310,230 490,230 530,290" fill="#243354" stroke="#C99A3B" stroke-width="1.5" />
  <polygon points="295,230 330,180 470,180 505,230" fill="#1E2A46" stroke="#C99A3B" stroke-width="1.5" />
  
  <!-- Main Shikhara Tower (Curvilinear spire) -->
  <path d="M 350 290 Q 365 140 395 70 Q 400 60 405 70 Q 435 140 450 290 Z" fill="#2A3855" stroke="#C99A3B" stroke-width="2.5" />
  <!-- Horizontal Carving Rings -->
  <line x1="360" y1="250" x2="440" y2="250" stroke="#C99A3B" stroke-width="1.5" />
  <line x1="368" y1="210" x2="432" y2="210" stroke="#C99A3B" stroke-width="1.5" />
  <line x1="378" y1="170" x2="422" y2="170" stroke="#C99A3B" stroke-width="1.5" />
  <line x1="388" y1="130" x2="412" y2="130" stroke="#C99A3B" stroke-width="1.5" />
  
  <!-- Kalash & Flag (Dhwaja) -->
  <circle cx="400" cy="55" r="7" fill="#C99A3B" />
  <line x1="400" y1="55" x2="400" y2="30" stroke="#C99A3B" stroke-width="2" />
  <polygon points="400,30 435,40 400,50" fill="#D97736" />
  
  <!-- Deepastambha (Pillar of light / Arrow Pillar) -->
  <rect x="580" y="240" width="12" height="100" fill="#1E2A46" stroke="#C99A3B" stroke-width="1.5" />
  <polygon points="586,215 575,240 597,240" fill="#C99A3B" />
  
  <!-- Decorative Frame & Title Badge -->
  <rect x="24" y="24" width="752" height="452" fill="none" stroke="#C99A3B" stroke-width="1" opacity="0.4" />
  <rect x="35" y="35" width="220" height="42" fill="#1E2A46" fill-opacity="0.85" stroke="#C99A3B" stroke-width="1" />
  <text x="50" y="55" fill="#C99A3B" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" letter-spacing="2">SACRED JYOTIRLINGA</text>
  <text x="50" y="70" fill="#F6F4EF" font-family="'Fraunces', serif" font-size="14" font-weight="600">Somnath Temple Coast</text>
</svg>