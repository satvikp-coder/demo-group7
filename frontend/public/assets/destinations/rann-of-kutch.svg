<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rannSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F1829" />
      <stop offset="50%" stop-color="#1B2742" />
      <stop offset="100%" stop-color="#34466B" />
    </linearGradient>
    <linearGradient id="saltGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2DFD8" />
      <stop offset="40%" stop-color="#F6F4EF" />
      <stop offset="100%" stop-color="#DAD6CC" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#rannSky)" />
  
  <!-- Desert Stars -->
  <circle cx="120" cy="70" r="1.5" fill="#F6F4EF" opacity="0.8" />
  <circle cx="280" cy="50" r="1" fill="#F6F4EF" opacity="0.6" />
  <circle cx="450" cy="80" r="1.5" fill="#C99A3B" opacity="0.8" />
  <circle cx="620" cy="60" r="1" fill="#F6F4EF" opacity="0.7" />
  <circle cx="710" cy="110" r="1.5" fill="#F6F4EF" opacity="0.8" />
  <circle cx="180" cy="130" r="1" fill="#F6F4EF" opacity="0.5" />
  <circle cx="530" cy="140" r="1" fill="#F6F4EF" opacity="0.6" />
  
  <!-- Full Moon / Twilight Glow -->
  <circle cx="680" cy="100" r="28" fill="#F6F4EF" opacity="0.9" />
  <circle cx="680" cy="100" r="42" fill="#F6F4EF" opacity="0.15" />
  
  <!-- Horizon Line and Distant Kalo Dungar Hill Silhouette -->
  <polygon points="0,270 180,255 350,265 520,250 800,270 800,275 0,275" fill="#18233C" opacity="0.7" />
  
  <!-- White Salt Plains (Vast Salt Crust Crustal Reflections) -->
  <rect y="270" width="800" height="230" fill="url(#saltGround)" />
  
  <!-- Hexagonal Salt Crystal Cracks Patterns -->
  <path d="M 50 320 L 90 310 L 140 325 L 150 360 L 100 375 L 60 355 Z" stroke="#C99A3B" stroke-width="1" fill="none" opacity="0.35" />
  <path d="M 140 325 L 200 315 L 250 330 L 240 370 L 190 380 L 150 360" stroke="#C99A3B" stroke-width="1" fill="none" opacity="0.35" />
  <path d="M 280 340 L 340 330 L 390 350 L 375 390 L 320 400 L 270 380 Z" stroke="#C99A3B" stroke-width="1" fill="none" opacity="0.35" />
  <path d="M 450 330 L 520 320 L 580 340 L 560 385 L 500 395 L 440 375 Z" stroke="#C99A3B" stroke-width="1.2" fill="none" opacity="0.35" />
  <path d="M 600 350 L 670 340 L 730 365 L 710 410 L 640 420 L 590 395 Z" stroke="#C99A3B" stroke-width="1.2" fill="none" opacity="0.35" />

  <!-- Traditional Circular Kutchi Bhunga (Artisan Hut) -->
  <rect x="220" y="340" width="110" height="50" fill="#8C7D70" rx="4" />
  <polygon points="275,270 205,340 345,340" fill="#B3804D" stroke="#5A432F" stroke-width="2" />
  <!-- Traditional Lippan Mirrorwork Door -->
  <rect x="260" y="355" width="30" height="35" fill="#1E2A46" rx="2" />
  <circle cx="275" cy="365" r="3" fill="#F6F4EF" />
  
  <!-- Camel Caravan Silhouette in Distance -->
  <g fill="#1E2A46" opacity="0.85" transform="translate(480, 240) scale(0.6)">
    <!-- Camel 1 -->
    <path d="M 20 40 Q 25 25 35 25 Q 45 25 50 35 Q 60 20 75 25 Q 85 35 90 50 L 85 85 L 80 85 L 75 55 L 60 55 L 55 85 L 50 85 L 52 50 L 35 50 L 30 85 L 25 85 L 28 45 Z" />
    <!-- Camel 2 -->
    <path d="M 110 42 Q 115 28 125 28 Q 135 28 140 37 Q 150 24 165 28 Q 175 37 180 52 L 175 85 L 170 85 L 165 57 L 150 57 L 145 85 L 140 85 L 142 52 L 125 52 L 120 85 L 115 85 Z" />
    <line x1="90" y1="45" x2="110" y2="45" stroke="#1E2A46" stroke-width="1.5" />
  </g>

  <!-- Title Badge -->
  <rect x="24" y="24" width="752" height="452" fill="none" stroke="#C99A3B" stroke-width="1" opacity="0.4" />
  <rect x="35" y="35" width="220" height="42" fill="#1E2A46" fill-opacity="0.85" stroke="#C99A3B" stroke-width="1" />
  <text x="50" y="55" fill="#C99A3B" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" letter-spacing="2">WHITE SALT DESERT</text>
  <text x="50" y="70" fill="#F6F4EF" font-family="'Fraunces', serif" font-size="14" font-weight="600">Great Rann of Kutch</text>
</svg>