<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="chmSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141E34" />
      <stop offset="65%" stop-color="#28395A" />
      <stop offset="100%" stop-color="#A67C3A" stop-opacity="0.5" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#chmSky)" />
  
  <!-- Pavagadh Volcanic Hill in Background -->
  <polygon points="60,320 280,120 400,200 540,100 760,320" fill="#1B263D" stroke="#C99A3B" stroke-width="1" opacity="0.6" />
  <!-- Kalika Mata Temple Peak Shikhara on Pavagadh Summit -->
  <polygon points="536,100 540,82 544,100" fill="#C99A3B" />
  
  <!-- Ground Plinth -->
  <rect y="320" width="800" height="180" fill="#192336" />
  
  <!-- Jama Masjid Champaner Stone Facade (Indo-Islamic Solanki fusion) -->
  <rect x="180" y="240" width="440" height="90" fill="#243350" stroke="#C99A3B" stroke-width="2" />
  
  <!-- 30m Twin Carved Minarets -->
  <!-- Left Minaret -->
  <rect x="160" y="110" width="30" height="220" fill="#2A3C5E" stroke="#C99A3B" stroke-width="2" />
  <polygon points="175,70 155,110 195,110" fill="#C99A3B" />
  <line x1="160" y1="160" x2="190" y2="160" stroke="#C99A3B" stroke-width="1.5" />
  <line x1="160" y1="210" x2="190" y2="210" stroke="#C99A3B" stroke-width="1.5" />

  <!-- Right Minaret -->
  <rect x="610" y="110" width="30" height="220" fill="#2A3C5E" stroke="#C99A3B" stroke-width="2" />
  <polygon points="625,70 605,110 645,110" fill="#C99A3B" />
  <line x1="610" y1="160" x2="640" y2="160" stroke="#C99A3B" stroke-width="1.5" />
  <line x1="610" y1="210" x2="640" y2="210" stroke="#C99A3B" stroke-width="1.5" />

  <!-- Central Grand Ogee Arch (Pronaod) with Jali Lattice -->
  <path d="M 330 330 L 330 230 Q 400 170 470 230 L 470 330 Z" fill="#141E33" stroke="#C99A3B" stroke-width="2.5" />
  <!-- Side Arches -->
  <path d="M 230 330 L 230 265 Q 265 230 300 265 L 300 330 Z" fill="#141E33" stroke="#C99A3B" stroke-width="1.5" />
  <path d="M 500 330 L 500 265 Q 535 230 570 265 L 570 330 Z" fill="#141E33" stroke="#C99A3B" stroke-width="1.5" />
  
  <!-- Central Dome -->
  <path d="M 360 210 Q 400 160 440 210 Z" fill="#C99A3B" opacity="0.8" />

  <!-- Title Badge -->
  <rect x="24" y="24" width="752" height="452" fill="none" stroke="#C99A3B" stroke-width="1" opacity="0.4" />
  <rect x="35" y="35" width="220" height="42" fill="#1E2A46" fill-opacity="0.85" stroke="#C99A3B" stroke-width="1" />
  <text x="50" y="55" fill="#C99A3B" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" letter-spacing="2">UNESCO WORLD HERITAGE</text>
  <text x="50" y="70" fill="#F6F4EF" font-family="'Fraunces', serif" font-size="14" font-weight="600">Champaner-Pavagadh</text>
</svg>