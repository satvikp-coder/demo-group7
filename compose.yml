x-bounded-logs: &bounded-logs
  driver: local
  options:
    max-size: '10m'
    max-file: '5'
services:
  postgres:
    logging: *bounded-logs
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: heritage_planner
      POSTGRES_USER: heritage_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set POSTGRES_APP_PASSWORD}
    volumes:
      - production_db:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U heritage_owner -d heritage_planner']
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    logging: *bounded-logs
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL with host postgres}
      DATABASE_SSL: disable
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set the exact frontend origin}
      TRUST_PROXY: uniquelocal
      DB_POOL_MAX: 10
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  frontend:
    logging: *bounded-logs
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - '127.0.0.1:${HTTP_PORT:-8080}:8080'
    depends_on:
      backend:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  maintenance:
    logging: *bounded-logs
    profiles: [maintenance]
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_ADMIN_URL:?Set DATABASE_ADMIN_URL for maintenance only}
      DATABASE_SSL: disable
      DB_APP_ROLE: heritage_app
    depends_on:
      postgres:
        condition: service_healthy
    command: [npm, run, db:migrate]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  production_db:
