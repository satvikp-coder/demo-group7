name: Production readiness
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: heritage_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d heritage_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/heritage_ci
      NODE_ENV: test
      PORT: 5310
      CORS_ORIGIN: http://localhost:4310
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate ephemeral test secret
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'JWT_SECRET='+require('crypto').randomBytes(48).toString('hex')+'\n')"
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: pip install -r requirements-tests.txt
      - run: python -m playwright install --with-deps chrome
      # Database tests and browser fixtures execute sequentially, on isolated databases.
      - run: npm run test:all
      - run: npm run test:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-evidence
          path: |
            backend/reports/production/
            backend/reports/production-api-smoke.json
            backend/reports/production-source-audit.json
          retention-days: 14
